# Kiểm tra bản iOS biên dịch được (không ký, chạy trên máy ảo Mac của GitHub).
# Bản nộp App Store cần ký bằng tài khoản Apple Developer — xem docs/HUONG-DAN-XUAT-BAN.md.
name: iOS compile check

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          npm ci
          npm run build
          npx cap sync ios
      - name: Build cho iOS Simulator
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -30
